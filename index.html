<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>限流接法与分压接法 · 电压电流范围 · 可交互课件</title>
<style>
  :root{
    /* A · Manim 基调：纯黑底 + 白线为主 + Manim 官方色常量
       蓝 = 电流   红 = 电压   黄 = 结论量（当前滑片位置 / 这一屏要记住的话）
       一屏同屏彩色元素 ≤ 3 种；不使用渐变/霓虹/投影 */
    --bg:#000000; --bg2:#0a0a0a; --panel:#0e0e0e; --line:#242424; --line2:#383838;
    --ink:#FFFFFF; --ink2:#B0B0B0; --muted:#888888;
    --blue:#58C4DD; --red:#FC6255; --yellow:#FFFF00; --gold:#F0AC5F;
    --green:#83C167; --purple:#9A72AC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif; overflow:hidden;}
  .app{display:grid; grid-template-rows:auto auto 1fr auto auto; height:100vh;}

  header{display:flex; align-items:baseline; gap:12px; padding:9px 18px 7px; flex-wrap:wrap; row-gap:3px;
    background:var(--bg2); border-bottom:1px solid var(--line);}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.5px; white-space:nowrap;}
  .act{font-size:13px; color:var(--yellow); border:1px solid var(--line2); border-radius:10px; padding:1px 9px; white-space:nowrap;}
  .tag{font-size:12.5px; border:1px solid var(--line2); border-radius:10px; padding:1px 9px; white-space:nowrap;}
  .tag.blue{color:var(--blue);} .tag.red{color:var(--red);}
  .steptitle{font-size:15px; color:var(--ink); font-weight:600;}
  .stepsn{margin-left:auto; font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums;}

  .topnav{display:flex; align-items:center; gap:5px; padding:5px 14px 6px;
    background:var(--bg2); border-bottom:1px solid var(--line); overflow-x:auto; overflow-y:hidden;}
  .topnav .grouplab{flex:0 0 auto; font-size:11px; letter-spacing:.6px; color:var(--muted); font-weight:600; white-space:nowrap;}
  .topnav .sep{flex:0 0 auto; width:1px; height:15px; background:var(--line2); margin:0 5px;}
  .topnav a{flex:0 0 auto; min-width:27px; height:22px; padding:0 7px; display:inline-flex; align-items:center; justify-content:center;
    font-size:12px; font-variant-numeric:tabular-nums; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; cursor:pointer;}
  .topnav a:hover{background:#1e1e1e; color:var(--ink);}
  .topnav a.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}

  .stage{display:grid; grid-template-columns:1fr 300px; min-height:0;}
  .canvaswrap{position:relative; min-width:0; min-height:0; padding:6px 8px 0 8px;}
  canvas{display:block; width:100%; height:100%; cursor:grab; touch-action:none;}
  .hint{padding:6px 20px 0 20px; font-size:12.5px; color:var(--muted); min-height:32px;}
  .hint b{color:var(--yellow); font-weight:600;}

  aside{background:var(--panel); border-left:1px solid var(--line); padding:10px 12px 14px; overflow-y:auto; min-height:0;}
  aside h3{font-size:12px; color:var(--muted); margin:13px 0 6px; font-weight:600; letter-spacing:.5px;}
  aside h3:first-child{margin-top:2px;}
  .rd{display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:3px 0;
    font-size:12.5px; color:var(--ink2); border-bottom:1px dashed #242424;}
  .rd span{white-space:nowrap;}
  .rd b{font-size:14px; color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .rd b.blue{color:var(--blue);} .rd b.red{color:var(--red);}
  .rd b.yellow{color:var(--yellow);} .rd b.gold{color:var(--gold);} .rd b.grey{color:var(--muted);}
  .total{margin-top:8px; padding:8px 10px; border:1px solid var(--line2); border-radius:8px; background:#141414;}
  .total .lab{font-size:12px; color:var(--muted); display:block; margin-bottom:2px;}
  .total b{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.3px;}
  .total b.ok{color:var(--green);} .total b.warn{color:var(--gold);} .total b.bad{color:var(--red);}
  .formula{font-size:13.5px; color:var(--ink); background:#141414; border:1px solid var(--line2);
    border-radius:8px; padding:8px 10px; line-height:1.6; word-break:break-word;}
  .note{font-size:12.5px; color:var(--ink2); line-height:1.66;}
  .note b{color:var(--yellow); font-weight:600;}
  .grp{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .grp .lab{font-size:12.5px; color:var(--muted);}
  button{font-family:inherit; font-size:12.5px; color:var(--ink2); background:#141414;
    border:1px solid var(--line2); border-radius:6px; padding:5px 10px; cursor:pointer; white-space:nowrap;}
  button:hover{background:#1e1e1e; color:var(--ink);}
  button.on{background:rgba(255,255,0,0.12); border-color:var(--yellow); color:var(--yellow); font-weight:700;}
  button.main{background:#1a1a1a; color:var(--ink);}
  .hidden{display:none !important;}

  footer{display:flex; align-items:center; gap:8px; flex-wrap:wrap; row-gap:6px;
    padding:8px 14px 9px; background:var(--bg2); border-top:1px solid var(--line);}
  .bar{position:relative; flex:1 1 90px; min-width:70px; height:6px; background:#141414; border-radius:3px;}
  .bar i{display:block; height:100%; width:0; background:var(--yellow); border-radius:3px;}
  .slider{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted);}
  .slider input[type=range]{width:118px; accent-color:#4a4a4a;}
  .slider b{color:var(--ink); font-variant-numeric:tabular-nums; min-width:56px; text-align:right;}
  .slider i{font-style:normal; font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; min-width:104px;}

  @media (max-width: 980px){
    .stage{grid-template-columns:1fr 260px;}
    .slider input[type=range]{width:96px;}
  }
  @media (max-width: 760px){
    .stage{grid-template-columns:1fr; grid-template-rows:1fr auto;}
    aside{border-left:none; border-top:1px solid var(--line); max-height:29vh;}
    .canvaswrap{padding:3px 4px 0 4px;}
    .hint{padding:3px 10px 0 10px; min-height:20px; font-size:11.5px; line-height:1.36;}
    header{padding:5px 10px 4px; gap:8px;}
    header h1{font-size:14px;} .steptitle{font-size:12.5px; flex:1 1 100%; order:5;}
    .topnav{padding:4px 8px 5px;}
    footer{padding:6px 10px 7px; gap:6px;}
    .slider input[type=range]{width:78px;}
    .slider i{display:none;}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>限流接法 &amp; 分压接法</h1>
    <span class="act" id="actTag">第一幕</span>
    <span class="tag blue" id="modeTag">限流接法</span>
    <span class="steptitle" id="stepTitle">—</span>
    <span class="stepsn" id="stepSn">1 / 18</span>
  </header>

  <nav class="topnav" id="toc" aria-label="步骤导航"></nav>

  <div class="stage">
    <div class="canvaswrap"><canvas id="cv"></canvas></div>
    <aside>
      <h3 id="rdHead1">① 这一刻的量</h3>
      <div id="rdGroup1"></div>
      <h3 id="rdHead2">② 可调范围</h3>
      <div id="rdGroup2"></div>

      <div class="total"><span class="lab" id="rdRange">R₀ 与 R</span><b id="rdVerdict" class="ok">—</b></div>

      <h3>这一刻的公式</h3>
      <div class="formula" id="rdFormula">—</div>
      <h3>提示</h3>
      <div class="note" id="rdNote"></div>
      <div class="note" style="margin-top:6px;color:#888888">键盘 ← → 翻步；<b style="color:#F0AC5F">数字键 1 / 2</b> 直接切「限流 / 分压」。画布上可以直接拖动黄色的滑片。</div>
    </aside>
  </div>

  <div class="hint" id="hint"></div>

  <footer>
    <button id="btnPrev">◀ 上一步</button>
    <button id="btnNext" class="main">下一步 ▶</button>
    <button id="btnReset">↺ 复位本步</button>
    <div class="bar" id="prog"><i></i></div>

    <div class="slider" id="wrap_s"><span>滑片位置</span>
      <input type="range" id="rgS" min="0" max="1" step="0.01" value="0.5">
      <b id="lbS">s = 0.50</b><i id="lbS2"></i></div>

    <div class="slider" id="wrap_R0"><span>变阻器 R₀</span>
      <input type="range" id="rgR0" min="2" max="200" step="1" value="100">
      <b id="lbR0">100 Ω</b></div>

    <div class="slider" id="wrap_R"><span>负载 R</span>
      <input type="range" id="rgR" min="2" max="200" step="1" value="100">
      <b id="lbR">100 Ω</b></div>

    <div class="grp" id="wrap_mode"><span class="lab">接法</span>
      <button data-mode="limit">限流</button>
      <button data-mode="divider">分压</button>
    </div>

    <div class="grp" id="wrap_curve">
      <button id="btnCurve">叠加另一条曲线</button>
    </div>

    <div class="grp" id="wrapRatio"><span class="lab">典型比值</span>
      <button data-typ="0">R₀ = R/10</button>
      <button data-typ="1">R₀ = R</button>
      <button data-typ="2">R₀ = 10R</button>
    </div>
  </footer>
</div>

<script>


window.VizPhys = (function () {
'use strict';

var E = 6.0;
var R0_MIN = 2, R0_MAX = 200, R0_DEF = 100;
var R_MIN = 2, R_MAX = 200, R_DEF = 100;
var S_MIN = 0, S_MAX = 1, S_DEF = 0.5;

var TYP = [
{ key: 'small', R0: 20, R: 200, lab: 'R0 = R/10', sub: '变阻器远小于负载' },
{ key: 'equal', R0: 100, R: 100, lab: 'R0 = R', sub: '两者相当' },
{ key: 'large', R0: 200, R: 20, lab: 'R0 = 10R', sub: '变阻器远大于负载' }
];

function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
function parOf(a, b) { return (a > 0 && b > 0) ? (a * b) / (a + b) : 0; }
function racc(s, R0) { return (1 - clamp01(s)) * R0; }

function limitOf(s, R0, R) {
s = clamp01(s);
var Rx = (1 - s) * R0;
var I = E / (R + Rx);
return { s: s, Rx: Rx, I: I, U: I * R };
}
function limitRange(R0, R) {
return { Umin: E * R / (R + R0), Umax: E, Imin: E / (R + R0), Imax: E / R };
}

function dividerOf(s, R0, R) {
s = clamp01(s);
var Rlow = (1 - s) * R0, Rup = s * R0;
var par = parOf(Rlow, R);
var den = Rup + par;
var Im = den > 0 ? E / den : 0;
var U = den > 0 ? E * par / den : 0;
var I = R > 0 ? U / R : 0;
var I2 = Im - I;
return { s: s, Rup: Rup, Rlow: Rlow, par: par, Im: Im, I: I, I2: I2, U: U };
}

function dividerClosed(s, R0, R) {
var r = (1 - clamp01(s)) * R0;
var den = R * R0 + r * (R0 - r);
return den > 0 ? E * r * R / den : 0;
}
function dividerRange(R0, R) {
return { Umin: 0, Umax: E, Imin: 0, Imax: E / R };
}

function ranges(mode, R0, R) {
return mode === 'divider' ? dividerRange(R0, R) : limitRange(R0, R);
}
function outOf(mode, s, R0, R) {
return mode === 'divider' ? dividerOf(s, R0, R) : limitOf(s, R0, R);
}

function sweep(mode, R0, R, n) {
n = n || 121;
var pts = [], i, r, s, q, U, I;
for (i = 0; i < n; i++) {
r = R0 * i / (n - 1);
s = 1 - r / R0;
if (mode === 'divider') {
q = r / R0;
U = E * r * R / (R * R0 + r * (R0 - r));
I = R > 0 ? U / R : 0;
} else {
I = E / (R + r);
U = I * R;
}
pts.push({ r: r, s: s, U: U, I: I });
}
return pts;
}

function diagnose(R0, R) {
var k = R0 / R;
var Umin = E * R / (R + R0);
var ratio = Umin / E;
var level = k >= 1 ? 'ok' : (k >= 0.25 ? 'mid' : 'bad');
return { k: k, Umin: Umin, ratio: ratio, level: level };
}

function recommend(req, R0, R) {
var d = diagnose(R0, R);
if (req.fromZero) {
return { pick: 'divider', why: '电压要从 0 开始连续调节 —— 限流的起点永远大于 0' };
}
if (req.wideRange) {
return { pick: 'divider', why: '要求调节范围宽 / 要多组数据 —— 限流能到的范围太窄' };
}
if (d.level === 'bad') {
return { pick: 'divider', why: '变阻器最大阻值只有负载的 ' + d.k.toFixed(2) + ' 倍 —— 限流几乎调不动' };
}
return { pick: 'limit', why: '三条判据都不命中 —— 优先限流：接法简单、更省电' };
}

var QUIZ = [
{
q: '要描出小灯泡的伏安特性曲线，要求电压从 0 开始连续增大到额定值。',
hint: 'E = 6 V，变阻器 0 ~ 50 Ω，小灯泡约 10 Ω',
R0: 50, R: 10,
ans: 'divider',
why: '电压必须从 0 起调 —— 判据①命中，只能用分压。'
},
{
q: '用伏安法测一段电阻丝的阻值，只要求电压取几个不同的值。',
hint: 'E = 6 V，变阻器 0 ~ 5 Ω，电阻丝约 100 Ω',
R0: 5, R: 100,
ans: 'divider',
why: 'R0 只有 R 的 0.05 倍，限流时最低电压仍高达 95% E —— 判据③命中，用分压。'
},
{
q: '同样测电阻，要求电压取 3 V、4 V、5 V 三组数据。',
hint: 'E = 6 V，变阻器 0 ~ 200 Ω，待测电阻约 100 Ω',
R0: 200, R: 100,
ans: 'limit',
why: '不要求从 0 起调，范围也够（限流可到 E/3 ≈ 2 V ~ 6 V）—— 优先限流，更简单更省电。'
}
];

function runSelfTest() {
var fails = [], cases = 0;
function ok(name, cond, extra) {
cases++;
if (!cond) { fails.push(name + (extra ? ('　[' + extra + ']') : '')); }
}
function near(a, b, tol) { return Math.abs(a - b) <= (tol == null ? 1e-9 : tol); }

var L, D, i, s, prev, mono;

L = limitOf(0, 100, 100);
ok('限流 s=0（滑片在最左）：整段串入，R′=R0', near(L.Rx, 100), 'Rx=' + L.Rx);
ok('限流 s=0 且 R0=R：U = E/2 = 3 V', near(L.U, 3), 'U=' + L.U);
L = limitOf(1, 100, 100);
ok('限流 s=1（滑片在最右）：U = E', near(L.U, E), 'U=' + L.U);
ok('限流 s=1：接入阻值为 0', near(L.Rx, 0), 'Rx=' + L.Rx);
ok('限流 I = U/R 自洽', near(limitOf(0.37, 80, 120).I, limitOf(0.37, 80, 120).U / 120));

mono = true; prev = -1;
for (i = 0; i <= 200; i++) { var u1 = limitOf(i / 200, 100, 100).U; if (u1 < prev - 1e-12) { mono = false; } prev = u1; }
ok('限流 U 随 s 单调不减（滑片右移，电压升高）', mono);

D = dividerOf(0, 100, 100);
ok('分压 s=0（滑片在最左）：U = E（上段为 0）', near(D.U, E, 1e-12), 'U=' + D.U);
ok('分压 s=0：干路电流 = E/R∥', near(D.Im, E / 50), 'Im=' + D.Im);
ok('分压 s=0：负载电流 = E/R', near(D.I, E / 100), 'I=' + D.I);
ok('分压 s=0：上段电流 I总 − I负载 与下段自洽', near(D.I2, D.Im - D.I), 'I2=' + D.I2);
D = dividerOf(1, 100, 100);
ok('分压 s=1（滑片在最右）：U 严格为 0', D.U === 0, 'U=' + D.U);
ok('分压 s=1：负载被短路，I = 0，电流全走下段', D.I === 0 && near(D.I2, D.Im), 'I2=' + D.I2 + ' Im=' + D.Im);
D = dividerOf(0.5, 100, 100);
ok('分压 s=0.5 且 R0=R：U = 0.4E = 2.4 V', near(D.U, 2.4, 1e-12), 'U=' + D.U);

var worst = 0, i2ok = true;
for (i = 0; i <= 200; i++) {
s = i / 200;
var r0 = 20 + 180 * s, rr = 20 + 180 * (1 - s);
var dd = dividerOf(s, r0, rr);
worst = Math.max(worst, Math.abs(dd.U - dividerClosed(s, r0, rr)));
if (dd.I2 < -1e-12) { i2ok = false; }
}
ok('分压 U 的分式解 = 闭式解 U = E·R′·R/(R·R0+R′(R0−R′))', worst < 1e-12, 'maxdiff=' + worst);
ok('分压下段电流 I2 恒不为负', i2ok);

mono = true; prev = Infinity;
for (i = 0; i <= 200; i++) { var u2 = dividerOf(i / 200, 100, 100).U; if (u2 > prev + 1e-12) { mono = false; } prev = u2; }
ok('分压 U 随 s 单调不增（滑片右移，电压降低）', mono);

var ratioOk = true, cs = 0;
for (i = 0; i <= 60; i++) {
for (var j = 0; j <= 60; j++) {
s = i / 60; var R0v = 2 + 198 * j / 60, Rv = 2 + 198 * i / 60;
var r = (1 - s) * R0v;
var num = dividerOf(s, R0v, Rv).U, den2 = limitOf(s, R0v, Rv).U;
var expect = r * (Rv + r) / ((Rv + r) * (R0v - r) + Rv * r);
if (den2 > 1e-12 && Math.abs(num / den2 - expect) > 1e-9) { ratioOk = false; cs++; }
}
}
ok('同一滑片位置：U分/U限 = r(R+r)/[(R+r)(R₀−r)+Rr]', ratioOk, 'bad=' + cs);
ok('r = R₀ 端（滑片最左）：分压输出高于限流', dividerOf(0, 100, 100).U > limitOf(0, 100, 100).U);
ok('r → 0 端（滑片最右）：分压输出低于限流', dividerOf(0.9, 100, 100).U < limitOf(0.9, 100, 100).U);
ok('限流的可达电压集合 ⊂ 分压的可达电压集合',
limitRange(100, 100).Umin > dividerRange(100, 100).Umin &&
limitRange(100, 100).Umax <= dividerRange(100, 100).Umax);

var lr = limitRange(100, 100), dr = dividerRange(100, 100);
ok('限流最低电压 > 0（调不到 0）', lr.Umin > 0, 'Umin=' + lr.Umin);
ok('限流范围 = [E·R/(R+R0), E]', near(lr.Umin, 3) && near(lr.Umax, E));
ok('分压范围 = [0, E]', dr.Umin === 0 && near(dr.Umax, E));
ok('两者最高电压相同、起点不同', near(lr.Umax, dr.Umax) && (lr.Umin - dr.Umin > 1));
ok('限流最低电压公式 U=E·R/(R+R0)', near(limitRange(50, 150).Umin, E * 150 / 200), 'U=' + limitRange(50, 150).Umin);
ok('限流范围上下限就是 s=0 与 s=1 两端', near(limitOf(0, 100, 100).U, limitRange(100, 100).Umin) && near(limitOf(1, 100, 100).U, limitRange(100, 100).Umax));
ok('分压范围上下限就是 s=1 与 s=0 两端', near(dividerOf(1, 100, 100).U, 0) && near(dividerOf(0, 100, 100).U, E));

ok('分压最大电流 = E/R', near(dr.Imax, E / 100));
ok('两者最大电流相同（都等于 E/R）', near(lr.Imax, dr.Imax));
ok('限流最小电流 = E/(R+R0)', near(lr.Imin, E / 200));
ok('分压最小电流 = 0', dr.Imin === 0);

var sw = sweep('limit', 100, 100, 5);
ok('扫描 5 点', sw.length === 5);
ok('扫描首点 r=0 → 限流 U=E', near(sw[0].U, E) && near(sw[0].r, 0));
ok('扫描末点 r=R0 → 限流 U=Umin', near(sw[4].U, limitRange(100, 100).Umin) && near(sw[4].r, 100));
var swd = sweep('divider', 100, 100, 5);
ok('扫描首点限流与分压同 r=0：U 分别为 E 与 0', near(sw[0].U, E) && near(swd[0].U, 0));
ok('扫描末点 r=R0：限流 Umin、分压 E', near(sw[4].U, 3) && near(swd[4].U, E));
var midOk = true;
for (i = 0; i < sw.length; i++) {
if (!near(swd[i].U, dividerClosed(swd[i].s, 100, 100), 1e-12)) { midOk = false; }
}
ok('分压曲线逐点 = 闭式解', midOk);

var tiny = 1e-6;

return s;
}

function updatePanel() {
var o = P.outOf(st.mode, st.s, st.R0, st.R);
var rg = P.ranges(st.mode, st.R0, st.R);
var isDiv = (st.mode === 'divider');
var limTxt = isDiv ? '分压接法' : '限流接法';

setTxt('modeTag', limTxt, isDiv ? 'tag red' : 'tag blue');

document.getElementById('rdHead1').textContent = '① 这一刻的量（滑片位置 s = ' + st.s.toFixed(2) + '）';
var a1 = [
['负载两端电压 U', R.f2(o.U) + ' V', 'red'],
['负载电流 I', R.f3(o.I) + ' A', 'blue'],
['电源电动势 E', R.f2(P.E) + ' V', '']
];
if (isDiv) {
a1.push(['上段 R₁（串在干路）', R.f2(o.Rup) + ' Ω', 'blue']);
a1.push(['下段 R₂（与 R 并联）', R.f2(o.Rlow) + ' Ω', 'blue']);
a1.push(['干路电流 I总', R.f3(o.Im) + ' A', 'blue']);
} else {
a1.push(['接入段 R′（滑片→B）', R.f2(o.Rx) + ' Ω', 'blue']);
a1.push(['总电阻 R + R′', R.f2(st.R + o.Rx) + ' Ω', '']);
}
document.getElementById('rdGroup1').innerHTML = rows(a1);

document.getElementById('rdHead2').textContent = '② 可调范围（拖滑片能到的两端）';
var a2;
if (isDiv) {
a2 = [
['电压 U 范围', R.f2(rg.Umin) + ' ~ ' + R.f2(rg.Umax) + ' V', 'red'],
['能否调到 0', '能，从 0 连续可调', 'yellow'],
['电流 I 范围', R.f3(rg.Imin) + ' ~ ' + R.f3(rg.Imax) + ' A', 'blue'],
['范围宽度', '100% × E', 'yellow'],
['代价', '上段一直发热，更费电', 'grey']
];
} else {
a2 = [
['电压 U 范围', R.f2(rg.Umin) + ' ~ ' + R.f2(rg.Umax) + ' V', 'red'],
['能否调到 0', '不能，下限永远 > 0', 'yellow'],
['电流 I 范围', R.f3(rg.Imin) + ' ~ ' + R.f3(rg.Imax) + ' A', 'blue'],
['范围宽度', Math.round((rg.Umax - rg.Umin) / P.E * 100) + '% × E', 'yellow'],
['U_min / E = R/(R+R₀)', R.f2(rg.Umin / P.E) + ' 倍', 'grey']
];
}
document.getElementById('rdGroup2').innerHTML = rows(a2);

var d = P.diagnose(st.R0, st.R);
setTxt('rdRange', 'R₀ = ' + st.R0 + ' Ω　R = ' + st.R + ' Ω　R₀/R = ' + R.f2(d.k));
setTxt('rdVerdict', d.level === 'ok' ? '限流够用（R₀ ≥ R）' : (d.level === 'mid' ? '限流偏窄（R₀ 只有 R 的一半上下）' : '限流几乎调不动（R₀ ≪ R）→ 该用分压'),
d.level === 'ok' ? 'ok' : (d.level === 'mid' ? 'warn' : 'bad'));

document.getElementById('rdFormula').textContent = st.formula;
document.getElementById('rdNote').innerHTML = st.note;
}

function buildControls() {
var k, el, def;
var groups = [
{ id: 'wrap_s', on: !!(st.allow && st.allow.s) },
{ id: 'wrap_R0', on: !!(st.allow && st.allow.R0) },
{ id: 'wrap_R', on: !!(st.allow && st.allow.R) },
{ id: 'wrap_mode', on: !!(st.allow && st.allow.mode) },
{ id: 'wrap_curve', on: !!st.curveBoth && st.view === 'curve' }
];
for (k = 0; k < groups.length; k++) {
el = document.getElementById(groups[k].id);
if (el) { el.classList.toggle('hidden', !groups[k].on); }
}

def = st.rng.s || [0, 1, 0.01];
var rgS = document.getElementById('rgS');
rgS.min = def[0]; rgS.max = def[1]; rgS.step = def[2]; rgS.value = st.s;
def = st.rng.R0 || [P.R0_MIN, P.R0_MAX, 1];
var rg0 = document.getElementById('rgR0');
rg0.min = def[0]; rg0.max = def[1]; rg0.step = def[2]; rg0.value = st.R0;
def = st.rng.R || [P.R_MIN, P.R_MAX, 1];
var rgR = document.getElementById('rgR');
rgR.min = def[0]; rgR.max = def[1]; rgR.step = def[2]; rgR.value = st.R;

setTxt('lbS', 's = ' + st.s.toFixed(2), '');
var rp = P.racc(st.s, st.R0);
setTxt('lbS2', st.mode === 'divider' ? ('R₁ = ' + R.f2(st.s * st.R0) + ' / R₂ = ' + R.f2(rp) + ' Ω')
: ('接入 R′ = ' + R.f2(rp) + ' Ω'), '');
setTxt('lbR0', st.R0 + ' Ω', '');
setTxt('lbR', st.R + ' Ω', '');

var bs = document.querySelectorAll('#wrap_mode button');
for (k = 0; k < bs.length; k++) {
bs[k].classList.toggle('on', bs[k].dataset.mode === st.mode);
}
var bc = document.getElementById('btnCurve');
if (bc) { bc.classList.toggle('on', !!st.curveBoth); }
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function buildToc() {
var nav = document.getElementById('toc'), html = '', lastAct = '', i, d;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i];
if (d.act !== lastAct) {
if (lastAct) { html += '<span class="sep"></span>'; }
html += '<span class="grouplab">' + esc(d.act.split(' · ')[0]) + '</span>';
lastAct = d.act;
}
html += '<a data-go="' + i + '" title="' + esc(d.title) + '">' + (i + 1) + '</a>';
}
nav.innerHTML = html;
nav.addEventListener('click', function (e) {
var a = e.target.closest ? e.target.closest('a[data-go]') : null;
if (a) { goto(parseInt(a.dataset.go, 10)); }
});
}
function markToc() {
var as = document.querySelectorAll('#toc a'), i;
for (i = 0; i < as.length; i++) {
as[i].classList.toggle('on', parseInt(as[i].dataset.go, 10) === st.step);
}
}

/* ===================== 绘制 ===================== */
function draw() {
updatePanel();
markToc();
buildControls();
fitCanvas();
R.draw(ctx, W, H, st);
document.getElementById('actTag').textContent = st.act;
document.getElementById('stepTitle').textContent = st.title;
document.getElementById('stepSn').textContent = (st.step + 1) + ' / ' + S.STEPS.length;
document.getElementById('hint').innerHTML = st.hint;
document.getElementById('prog').firstElementChild.style.width = ((st.step + 1) / S.STEPS.length * 100) + '%';
cv.style.cursor = (st.allow && st.allow.s) ? 'grab' : 'default';
}

/* ===================== 步骤机 ===================== */
function goto(i) { S.apply(st, i); draw(); }
function next() { if (st.step < S.STEPS.length - 1) { goto(st.step + 1); } }
function prev() { if (st.step > 0) { goto(st.step - 1); } }
function reset() { goto(st.step); }

function setS(v) {
st.s = P.clamp01(v);
if (st.rng && st.rng.s) {
var a = st.rng.s[0], b = st.rng.s[1], stp = st.rng.s[2];
st.s = Math.round(st.s / stp) * stp;
st.s = P.clamp01(st.s);
}
draw();
}
function setR0(v) { st.R0 = Math.max(1, Math.round(v)); draw(); }
function setR(v) { st.R = Math.max(1, Math.round(v)); draw(); }
function setMode(m) { st.mode = (m === 'divider') ? 'divider' : 'limit'; st.s = P.clamp01(st.s); draw(); }

/* ===================== 交互 ===================== */
function canvasXY(e) {
var r = cv.getBoundingClientRect();
return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function bind() {
document.getElementById('btnPrev').onclick = prev;
document.getElementById('btnNext').onclick = next;
document.getElementById('btnReset').onclick = reset;

document.getElementById('rgS').addEventListener('input', function () { setS(parseFloat(this.value)); });
document.getElementById('rgR0').addEventListener('input', function () { setR0(parseFloat(this.value)); });
document.getElementById('rgR').addEventListener('input', function () { setR(parseFloat(this.value)); });

document.getElementById('wrap_mode').addEventListener('click', function (e) {
var b = e.target.closest ? e.target.closest('button[data-mode]') : null;
if (b) { setMode(b.dataset.mode); }
});
document.getElementById('btnCurve').onclick = function () { st.curveBoth = !st.curveBoth; draw(); };
document.getElementById('wrapRatio').addEventListener('click', function (e) {
var b = e.target.closest ? e.target.closest('button[data-typ]') : null;
if (!b) { return; }
var t = P.TYP[parseInt(b.dataset.typ, 10)];
st.R0 = t.R0; st.R = t.R; draw();
});

/* 画布：点选卡片 / 拖滑片 */
cv.addEventListener('pointerdown', function (e) {
var p = canvasXY(e), hit = R.hitTest(W, H, st, p.x, p.y);
if (hit && hit.type === 'card' && st.allow && st.allow.card) { st.guidePick = hit.k; draw(); return; }
if (hit && hit.type === 'quiz' && st.allow && st.allow.quiz) { st.quizAns = hit.k; draw(); return; }
if (hit && hit.type === 'quizIdx' && st.allow && st.allow.quizIdx) { st.quizIdx = hit.k; st.quizAns = null; draw(); return; }
if (!(st.allow && st.allow.s)) { return; }
var wi = R.wiperAt(W, H, st);
drag = { xr0: wi.xr0, xr1: wi.xr1 };
try { cv.setPointerCapture(e.pointerId); } catch (err) { }   /* 合成事件没有活跃指针，兜底 */
cv.style.cursor = 'grabbing';
setS((p.x - wi.xr0) / Math.max(1, wi.xr1 - wi.xr0));
});
cv.addEventListener('pointermove', function (e) {
if (!drag) { return; }
var p = canvasXY(e);
setS((p.x - drag.xr0) / Math.max(1, drag.xr1 - drag.xr0));
});
function endDrag(e) {
drag = null;
cv.style.cursor = (st.allow && st.allow.s) ? 'grab' : 'default';
try { cv.releasePointerCapture(e.pointerId); } catch (err) { }
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', function () { drag = null; });

document.addEventListener('keydown', function (e) {
if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) { return; }
if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
else if (e.key === 'Home') { goto(0); }
else if (e.key === 'End') { goto(S.STEPS.length - 1); }
else if ((e.key === '1' || e.key === '2') && st.allow && st.allow.mode) { setMode(e.key === '1' ? 'limit' : 'divider'); }
});

window.addEventListener('resize', function () { fitCanvas(); R.draw(ctx, W, H, st); });
}

/* ===================== 自检钩子 ===================== */
function hash() {
if (!W || !H) { return 'empty'; }
var d = ctx.getImageData(0, 0, Math.min(W, cv.width), Math.min(H, cv.height)).data;
var h = 2166136261 >>> 0, i, step = 97;
for (i = 0; i < d.length; i += step * 4) {
h ^= d[i]; h = Math.imul(h, 16777619) >>> 0;
h ^= d[i + 1]; h = Math.imul(h, 16777619) >>> 0;
h ^= d[i + 2]; h = Math.imul(h, 16777619) >>> 0;
}
return (h >>> 0).toString(16);
}

/* 验收第 5 条：hint 说能拖的，allow 里必须有 */
function checkAllowConsistency() {
var bad = [], i, d, t, a;
for (i = 0; i < S.STEPS.length; i++) {
d = S.STEPS[i]; t = d.hint || ''; a = d.allow || {};
if (/拖/.test(t) && !(a.s || a.drag)) { bad.push('step' + (i + 1) + ': hint 提到拖动，allow.s/drag 缺失'); }
if (/滑片/.test(t) && !(a.s || a.drag)) { bad.push('step' + (i + 1) + ': hint 提到滑片，allow.s/drag 缺失'); }
if (/变阻器最大阻值|R₀/.test(t) && !a.R0) { bad.push('step' + (i + 1) + ': hint 提到 R₀，allow.R0 缺失'); }
if (/负载阻值/.test(t) && !a.R) { bad.push('step' + (i + 1) + ': hint 提到负载阻值，allow.R 缺失'); }
if (/限流 \/ 分压|点「限流/.test(t) && !a.mode) { bad.push('step' + (i + 1) + ': hint 提到接法切换，allow.mode 缺失'); }
if (/卡片/.test(t) && !(a.card || a.quiz)) { bad.push('step' + (i + 1) + ': hint 提到卡片，allow.card/quiz 缺失'); }
if (/圆点可切题/.test(t) && !a.quizIdx) { bad.push('step' + (i + 1) + ': hint 提到切题，allow.quizIdx 缺失'); }
}
return { ok: bad.length === 0, bad: bad };
}

window.__viz = {
selfTest: function () {
var p = P.runSelfTest();
var c = checkAllowConsistency();
var fails = p.fails.slice();
var n = p.nfail + (c.ok ? 0 : c.bad.length);
if (!c.ok) { fails = fails.concat(c.bad); }
return { pass: n === 0, cases: p.cases, nfail: n, fails: fails.slice(0, 12) };
},
hash: hash, goto: goto, next: next, prev: prev,
state: function () { return st; },
steps: S.STEPS.length,
checkAllow: checkAllowConsistency,
setS: setS, setR0: setR0, setR: setR, setMode: setMode,
diag: function () { return { W: W, H: H, cw: cv.width, ch: cv.height, view: st.view, mode: st.mode, step: st.step, s: st.s }; }
};

/* ===================== 启动 ===================== */
buildToc();
bind();
goto(0);
window.addEventListener('load', function () { fitCanvas(); R.draw(ctx, W, H, st); });
})();

</script>
</body>
</html>
